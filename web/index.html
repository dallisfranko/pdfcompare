<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="no-referrer" />
  <title>PdfOverlay v0.6.0</title>
  <link rel="stylesheet" href="styles.css?v=0.6.0" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div>
        <h1>
          PdfOverlay
          <span class="version" id="appVersion" title="Build version">v0.6.0</span>
        </h1>
        <p class="tagline">
          <span class="legend"><span class="swatch red"></span> A &nbsp; <span class="swatch blue"></span> B &nbsp; dark = same</span>
        </p>
      </div>
      <button type="button" id="clearAllBtn" class="btn danger">Clear</button>
    </header>

    <aside class="sidebar">
      <section class="panel panel-sheet">
        <h2>Flip sheets</h2>
        <div class="sheet-nav" role="group" aria-label="Page navigation">
          <button type="button" id="prevBoth" class="btn sheet-btn" disabled title="Previous sheet (←)">‹</button>
          <div class="sheet-center">
            <p id="pageMeta" class="page-meta sheet-meta">Load both PDFs</p>
          </div>
          <button type="button" id="nextBoth" class="btn sheet-btn" disabled title="Next sheet (→)">›</button>
        </div>
      </section>

      <section class="panel">
        <h2>Document A <span class="chip red">red</span></h2>
        <label class="file-btn">
          Choose PDF A
          <input id="fileA" type="file" accept="application/pdf,.pdf" />
        </label>
        <p id="nameA" class="filename">No file chosen</p>
        <label class="page-label doc-page" for="pageA">
          Page
          <select id="pageA" disabled></select>
        </label>
      </section>

      <section class="panel">
        <h2>Document B <span class="chip blue">blue</span></h2>
        <label class="file-btn">
          Choose PDF B
          <input id="fileB" type="file" accept="application/pdf,.pdf" />
        </label>
        <p id="nameB" class="filename">No file chosen</p>
        <label class="page-label doc-page" for="pageB">
          Page
          <select id="pageB" disabled></select>
        </label>
      </section>

      <section class="panel">
        <h2>Compare</h2>
        <label class="stack">Blue layer strength
          <input id="opacity" type="range" min="0.15" max="1" step="0.05" value="1" />
          <span id="opacityLabel">100%</span>
        </label>
      </section>

      <section class="panel">
        <h2>Align</h2>
        <label class="check-row">
          <input id="snapContent" type="checkbox" checked />
          Snap to corners / endpoints
        </label>
        <button type="button" id="alignStartBtn" class="btn primary">Start 2-point align</button>
        <button type="button" id="alignCancelBtn" class="btn" hidden>Cancel</button>
        <button type="button" id="resetAlignBtn" class="btn">Reset alignment</button>
        <p id="alignStatus" class="align-status">Alignment: none</p>
      </section>

      <section class="panel">
        <h2>View</h2>
        <div class="btn-row">
          <button type="button" id="zoomOut" class="btn small">−</button>
          <button type="button" id="zoomIn" class="btn small">+</button>
          <button type="button" id="zoomFit" class="btn">Fit</button>
          <button type="button" id="zoomReset" class="btn">100%</button>
        </div>
        <p id="zoomLabel">100%</p>
      </section>
    </aside>

    <main class="main">
      <p id="status" class="status">Choose two PDFs to begin.</p>
      <div id="viewport" class="viewport is-empty" title="Drag to pan · scroll to zoom">
        <div id="emptyStage" class="empty-stage" aria-hidden="true">
          <div class="empty-page"></div>
          <p class="empty-label">Choose two PDFs</p>
        </div>
        <div id="alignRef" class="align-ref" hidden>
          <p id="alignRefTitle" class="align-ref-title">Match this on the other PDF</p>
          <canvas id="alignRefCanvas" width="160" height="160"></canvas>
        </div>
        <div id="viewportInner" class="viewport-inner">
          <canvas id="overlayCanvas"></canvas>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="app.js?v=0.6.0"></script>
</body>
</html>
